<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nền Tảng Giáo Dục & Nghề Nghiệp</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & Be Vietnam Pro (Full Vietnamese Subsets) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

  <!-- Base Tokens & Component Styles -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/customize.css">
</head>
<body data-page="home">
  <!-- Container nhận các Web Components được nạp JIT từ core.js -->
  <div id="app">
    <!-- Nội dung tạm hiển thị trước khi tải cấu hình -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; color: #64748b;">
      <div style="text-align: center;">
        <div style="font-size: 2rem; margin-bottom: 0.5rem; animation: pulse 1.5s infinite;">⏳</div>
        <div>Đang nạp cấu hình hệ thống...</div>
      </div>
    </div>
  </div>

  <!-- Core Engine nạp JSON & Dựng Web Components -->
  <script type="module" src="js/core.js"></script>
  <script type="module" src="js/customize.js"></script>
  <script src="js/app.js"></script>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.95); }
    }
  </style>
</body>
</html>
